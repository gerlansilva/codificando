[package]
name = "codificando"
version = "0.1.0"
description = "Codificando — análise qualitativa de dados"
authors = ["Gerlan Silva da Silva"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "codificando_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
objc2-vision = "0.3"
objc2-foundation = "0.3"
objc2 = "0.6"
