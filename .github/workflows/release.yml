name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      # Sem os segredos de assinatura, o build sai sem assinar. Para assinar e
      # notarizar, configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD e APPLE_TEAM_ID nos
      # segredos do repositório e acrescente o bloco `env` correspondente.
      - name: Build e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codificando ${{ github.ref_name }}
          releaseBody: |
            Codificando ${{ github.ref_name }} — análise qualitativa de dados, 100% local.

            macOS (Apple Silicon): baixe o `.dmg` e arraste o Codificando para Aplicativos.
            Windows (x64): baixe o instalador `.msi` ou `.exe`.

            Nesta versão: as marcações do PDF ficam translúcidas, com o texto legível
            por cima, e a seleção de texto acompanha o zoom.

            O manual completo está em anexo (`Codificando-manual-0.2.1.pdf`).
            Não há certificado de desenvolvedor: o app é gratuito e sem mensalidade.
            No macOS, abra com botão direito → Abrir; no Windows, use
            "Mais informações → Executar assim mesmo" se o SmartScreen avisar.
          releaseDraft: true
          prerelease: false
          args: >-
            --target aarch64-apple-darwin
            --config src-tauri/tauri.ci.conf.json

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codificando ${{ github.ref_name }}
          releaseBody: |
            Codificando ${{ github.ref_name }} — análise qualitativa de dados, 100% local.

            macOS (Apple Silicon): baixe o `.dmg` e arraste o Codificando para Aplicativos.
            Windows (x64): baixe o instalador `.msi` ou `.exe`.

            Nesta versão: as marcações do PDF ficam translúcidas, com o texto legível
            por cima, e a seleção de texto acompanha o zoom.

            O manual completo está em anexo (`Codificando-manual-0.2.1.pdf`).
            Não há certificado de desenvolvedor: o app é gratuito e sem mensalidade.
            No macOS, abra com botão direito → Abrir; no Windows, use
            "Mais informações → Executar assim mesmo" se o SmartScreen avisar.
          releaseDraft: true
          prerelease: false
          args: >-
            --config src-tauri/tauri.ci.conf.json
