name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      # Sem os segredos de assinatura, o build sai sem assinar. Para assinar e
      # notarizar, configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD e APPLE_TEAM_ID nos
      # segredos do repositório e acrescente o bloco `env` correspondente.
      - name: Build e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codificando ${{ github.ref_name }}
          releaseBody: |
            Codificando ${{ github.ref_name }} — análise qualitativa de dados, 100% local.

            macOS (Apple Silicon): baixe o `.dmg` e arraste o Codificando para Aplicativos.
            Windows (x64): baixe o instalador `.msi` ou `.exe`.

            Novidades: tela inicial, arrastar e soltar no estilo do ATLAS.ti, Modo Área
            para codificar figuras, gráficos e quadros do PDF, exportação das redes em
            SVG/PNG e créditos do autor. Detalhes no CHANGELOG.md e em docs/GUIA-RAPIDO.md.

            Não há certificado de desenvolvedor: o app é gratuito e sem mensalidade.
            No macOS, abra com botão direito → Abrir (ou Ajustes → Privacidade e
            Segurança → Abrir mesmo assim). Se disser "danificado", rode no Terminal:
            xattr -cr /Applications/Codificando.app
            No Windows, use "Mais informações → Executar assim mesmo" se o SmartScreen avisar.
            Passo a passo em COMO-ABRIR.txt.
          releaseDraft: false
          prerelease: false
          args: >-
            --target aarch64-apple-darwin
            --config src-tauri/tauri.ci.conf.json

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codificando ${{ github.ref_name }}
          releaseBody: |
            Codificando ${{ github.ref_name }} — análise qualitativa de dados, 100% local.

            macOS (Apple Silicon): baixe o `.dmg` e arraste o Codificando para Aplicativos.
            Windows (x64): baixe o instalador `.msi` ou `.exe`.

            Novidades: tela inicial, arrastar e soltar no estilo do ATLAS.ti, Modo Área
            para codificar figuras, gráficos e quadros do PDF, exportação das redes em
            SVG/PNG e créditos do autor. Detalhes no CHANGELOG.md e em docs/GUIA-RAPIDO.md.

            Não há certificado de desenvolvedor: o app é gratuito e sem mensalidade.
            No macOS, abra com botão direito → Abrir (ou Ajustes → Privacidade e
            Segurança → Abrir mesmo assim). Se disser "danificado", rode no Terminal:
            xattr -cr /Applications/Codificando.app
            No Windows, use "Mais informações → Executar assim mesmo" se o SmartScreen avisar.
            Passo a passo em COMO-ABRIR.txt.
          releaseDraft: false
          prerelease: false
          args: >-
            --config src-tauri/tauri.ci.conf.json
